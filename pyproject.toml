[build-system]
build-backend = "uv_build"
requires = ["uv-build>=0.11.14,<0.12"]

[project]
name = "toucan-plot"
version = "0.7.2"
requires-python = ">=3.13"
description = "Interactive CAN bus log viewer and plotting tool for BLF, ASC, TRC, MF4, and CSV files."
keywords = [
    "can",
    "can-bus",
    "canbus",
    "can-logs",
    "dbc",
    "blf",
    "asc",
    "trc",
    "mf4",
    "csv",
    "smv",
    "feather",
    "plotting",
    "data-visualization",
    "signal-analysis",
    "matplotlib",
    "pyside6",
]
classifiers = [
    "Environment :: X11 Applications :: Qt",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Natural Language :: English",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: Implementation :: CPython",
    "Topic :: Scientific/Engineering :: Information Analysis",
    "Topic :: Scientific/Engineering :: Visualization",
    "Topic :: Software Development :: Embedded Systems :: Controller Area Network (CAN)",
]
license = "MIT"
readme = { file = "README.md", content-type = "text/markdown" }
dependencies = [
    "pyside6>=6.0",
    "matplotlib>=3.0",
    "numpy>=1.20",
    "pyqtdarktheme>=2.1.0",
    "scienceplots>=2.2.1",
    "python-can>=4.0",
    "cantools>=39.0",
    "asammdf>=7.0",
    "pyarrow>=23.0.1",
    "chardet>=7.4.3",
]

[project.urls]
Homepage = "https://github.com/claudiiolima/toucan-plot"
Repository = "https://github.com/claudiiolima/toucan-plot"

[project.scripts]
toucan-plot = "toucan_plot.main:main"

[tool.setuptools.package-data]
toucan_plot = ["assets/**/*.svg", "assets/**/*.ico"]

[dependency-groups]
dev = [
    "nuitka[all]>=4.1",
    "uv-build>=0.11.14",
    "zstandard>=0.25.0",
]
lint = [
    "ruff>=0.15.9",
]
