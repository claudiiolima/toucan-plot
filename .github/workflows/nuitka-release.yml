# This workflow will install Python dependencies, run tests and lint with a variety of Python versions
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-python

name: "TouCAN-Plot Release"

on:
  push:
    tags:
      - "v*" # Push events to matching v*, i.e. v1.0, v20.15.10

permissions:
  contents: write # Required to create/update releases

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build_and_release:
    runs-on: windows-latest

    strategy:
      matrix:
        python-version: ["3.13"]

    steps:
    - uses: actions/checkout@v6
      with:
        fetch-depth: 5

    - name: "Print Debug info"
      run: |
        echo $env:USERPROFILE
        echo $env:PATH
        echo "$PWD"

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v6
      with:
        python-version: ${{ matrix.python-version }}

    - name: Upgrade pip
      run: |
        python -m pip install --upgrade pip

    - name: Install dependencies
      run: |
        python -m pip install uv
        uv venv .venv --python ${{ matrix.python-version }}
        .\.venv\Scripts\activate
        uv sync

    - name: Retrieve version
      id: version
      run: |
        echo "VERSION=$(uv version --short)" >> "$GITHUB_OUTPUT"

    - name: Build
      run: |
        .\.venv\Scripts\activate
        uv build

    - name: Distribute Executable
      run: |
        .\.venv\Scripts\activate
        uv --no-progress run -- nuitka --mode=standalone --include-package=chardet --include-package=scienceplots --follow-imports --include-package-data=chardet --include-package-data=scienceplots --include-data-dir=src/toucan_plot/assets=assets --include-windows-runtime-dlls=yes --assume-yes-for-downloads --output-folder-name=toucan-plot --windows-console-mode=disable --windows-icon-from-ico=src/toucan_plot/assets/ico/toucan-plot.ico --linux-icon=src/toucan_plot/assets/ico/toucan-plot.png src/toucan_plot/main.py --product-name="TouCAN-Plot" --product-version=${{ steps.version.outputs.VERSION }} --file-description="A versatile PyQt6 and Matplotlib-based plotting tool for CSV and SMV data files." --copyright="Claudio Lima <claudiiolima@gmail.com> and contributors. Distributed under MIT license." --enable-plugin=uv --no-progress run -- nuitka --mode=onefile --include-package=chardet --include-package=scienceplots --follow-imports --include-package-data=chardet --include-package-data=scienceplots --include-data-dir=src/toucan_plot/assets=assets --include-windows-runtime-dlls=yes --assume-yes-for-downloads --output-filename=dist/toucan-plot-0.4.0p.exe --windows-console-mode=disable --windows-icon-from-ico=src/toucan_plot/assets/ico/toucan-plot.ico --linux-icon=src/toucan_plot/assets/ico/toucan-plot.png src/toucan_plot/main.py --product-name="TouCAN-Plot" --product-version=0.4.0 --file-description="A versatile PyQt6 and Matplotlib-based plotting tool for CSV and SMV data files." --copyright="Claudio Lima <claudiiolima@gmail.com> and contributors. Distributed under MIT license." --enable-plugin=pyside6
        makensis /DVERSION=${{ steps.version.outputs.VERSION }} ./.installer/toucan-plot.nsi
        move .installer/*.exe dist

    - name: Distribute Portable Executable
      run: |
        .\.venv\Scripts\activate
        uv --no-progress run -- nuitka --mode=onefile --include-package=chardet --include-package=scienceplots --follow-imports --include-package-data=chardet --include-package-data=scienceplots --include-data-dir=src/toucan_plot/assets=assets --include-windows-runtime-dlls=yes --assume-yes-for-downloads --output-filename=dist/toucan-plot-${{ steps.version.outputs.VERSION }}p.exe --windows-console-mode=disable --windows-icon-from-ico=src/toucan_plot/assets/ico/toucan-plot.ico --linux-icon=src/toucan_plot/assets/ico/toucan-plot.png src/toucan_plot/main.py --product-name="TouCAN-Plot" --product-version=${{ steps.version.outputs.VERSION }} --file-description="A versatile PyQt6 and Matplotlib-based plotting tool for CSV and SMV data files." --copyright="Claudio Lima <claudiiolima@gmail.com> and contributors. Distributed under MIT license." --enable-plugin=uv --no-progress run -- nuitka --mode=onefile --include-package=chardet --include-package=scienceplots --follow-imports --include-package-data=chardet --include-package-data=scienceplots --include-data-dir=src/toucan_plot/assets=assets --include-windows-runtime-dlls=yes --assume-yes-for-downloads --output-filename=dist/toucan-plot-0.4.0p.exe --windows-console-mode=disable --windows-icon-from-ico=src/toucan_plot/assets/ico/toucan-plot.ico --linux-icon=src/toucan_plot/assets/ico/toucan-plot.png src/toucan_plot/main.py --product-name="TouCAN-Plot" --product-version=0.4.0 --file-description="A versatile PyQt6 and Matplotlib-based plotting tool for CSV and SMV data files." --copyright="Claudio Lima <claudiiolima@gmail.com> and contributors. Distributed under MIT license." --enable-plugin=pyside6

    - name: Create and Upload Release Assets
      uses: softprops/action-gh-release@v2
      with:
        files: |
          dist/toucan-plot-${{ steps.version.outputs.VERSION }}.exe
          dist/toucan-plot-${{ steps.version.outputs.VERSION }}p.exe
        generate_release_notes: true # Auto-generates notes from commits
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
